server:
  port: 8088
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:3306/chat
    username: root
    password: "123456"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 600000
  data:
    redis:
      host: ${DB_HOST:127.0.0.1}
      port: 6379
      database: 2
      lettuce:
        pool:
          max-active: 8
          max-wait: 10s
          max-idle: 8
          min-idle: 2
    mongodb:
      host: ${DB_HOST:127.0.0.1}
      port: 27017
      uri: mongodb://zhenye:123456@${DB_HOST:127.0.0.1}:27017/chat?authSource=chat&directConnection=true
  kafka:
    bootstrap-servers: ${DB_HOST:127.0.0.1}:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: chat-group
  profiles:
    include: secret

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.mapper
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
logging:
  level:
    org:
        apache.kafka: warn
